<svg xmlns="http://www.w3.org/2000/svg" width="680" height="870" viewBox="0 0 680 870" role="img">
<title>Hookup: Adafruit DAC7578 breakout to NUCLEO-H723ZG</title>
<desc>Twelve wires. Outputs 0 to 5 to A0 to A5 on CN9, outputs 6 and 7 to D13 and D12 on CN7, VCC to 3V3 on CN8, GND, SCL and SDA to CN7. VRf, the second GND, LDAC and CLR stay unconnected.</desc>
