<text x="340" y="26" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#222">One-breakout DAC loopback rig</text>
<text x="340" y="48" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#555">Adafruit DAC7578 breakout (as shipped, address 0x4C)</text>
