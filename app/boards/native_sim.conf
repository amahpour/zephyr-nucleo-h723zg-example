# Virtual PCB target: ICs run as separate host processes.

CONFIG_APP_TARGET_VPCB=y

CONFIG_ADC=y
CONFIG_ADC_EMUL=y

CONFIG_I2C=y
CONFIG_I2C_VPCB=y

# DACx578 driver: the firmware now reaches the DACs through the DAC API
# rather than composing I2C bytes itself.
CONFIG_DAC=y

# 15 channels: two DAC7578s (0x48, 0x4c) give 16, we use 15.
CONFIG_APP_NUM_CH=15

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# Pace simulated time to wall clock. Not needed for correctness - the IC models
# are purely reactive and need no clock - but without it the 100 ms sample
# period elapses instantly and the ADC floods the board process with net reads.
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y

# Console on stdin/stdout instead of a pseudotty: simpler for automated tests
# and pipes (the pytest DUT then needs no PTY discovery at all).
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
