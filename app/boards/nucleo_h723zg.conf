# Board-specific configuration for NUCLEO-H723ZG (hardware)

# Select hardware target
CONFIG_APP_TARGET_HW=y

# ADC subsystem
CONFIG_ADC=y

# Number of ADC channels (15 for mux setup)
CONFIG_APP_NUM_CH=15

# I2C and the DACx578 driver. The DACs are declared in the overlay so the same
# driver that runs against the virtual PCB is compiled for hardware too.
CONFIG_I2C=y
CONFIG_DAC=y
