# Physical test configuration: the DAC loopback rig
#
# The Nucleo drives a DAC7578 breakout over its own I2C1, and the DAC's outputs
# are wired straight back into its own ADC inputs. The same firmware and the
# same driver run here as against the virtual PCB -- only the copper is real.
# Wiring is in docs/hardware.md.
#
# This describes the one-breakout rig, which needs no soldering: 8 channels.
# Its virtual twin is configs/vpcb-one-dac.yaml; run that first. For two
# breakouts and 15 channels, build with -DDTS_EXTRA_CPPFLAGS=-DAPP_DAC_COUNT=2
# and set num_channels to 15.
#
# Build and flash first:
#   west build -b nucleo_h723zg app --pristine
#   west flash --runner openocd
#
# Usage: pytest tests/integration/ --config=tests/integration/configs/physical.yaml -v

dut:
  type: physical
  # Nucleo ST-LINK virtual COM port (VID:0483 PID:374e, STLINK-V3).
  # With the mux controller gone this is the only USB serial device on the rig,
  # but /dev/ttyACM* numbering can still move -- see docs/hardware.md.
  port: /dev/ttyACM0
  baudrate: 115200

instrument:
  # Same instrument as the virtual PCB: voltages are set with `dacset` on the DUT.
  type: dac

# One 8-channel DAC. The firmware still samples all 15 ADC channels; the
# other seven pins float and are not tested.
num_channels: 8
